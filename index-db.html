<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Database Connected</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <img src="../assets/LOGO.png" alt="Logo" class="logo">
        <h2>Course Management System</h2>
        <p class="subtitle">Database Connected Version</p>
        
        <div id="message" class="message" style="display:none;"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('admin')">Admin</button>
            <button class="tab-btn" onclick="showTab('student')">Student</button>
        </div>
        
        <form id="adminForm" class="login-form active">
            <input type="text" id="adminUsername" placeholder="Admin Username" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login as Admin</button>
        </form>
        
        <form id="studentForm" class="login-form">
            <input type="text" id="studentUsername" placeholder="Student Username" required>
            <input type="password" id="studentPassword" placeholder="Password" required>
            <button type="submit">Login as Student</button>
        </form>
        
        <p class="note">Default: admin/admin123</p>
        <p class="note">Backend must be running on port 5001</p>
    </div>
</div>

<script src="script-db.js"></script>
</body>
</html>
